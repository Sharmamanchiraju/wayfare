version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: trip_planner_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-trip_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secure_password123}
      POSTGRES_DB: ${POSTGRES_DB:-trip_planner}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-trip_user} -d ${POSTGRES_DB:-trip_planner}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - trip_network

  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: trip_planner_backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-trip_user}:${POSTGRES_PASSWORD:-secure_password123}@db:5432/${POSTGRES_DB:-trip_planner}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_ALGORITHM=${JWT_ALGORITHM:-HS256}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      - REFRESH_TOKEN_EXPIRE_DAYS=${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - TAVILY_API_KEY=${TAVILY_API_KEY}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/docs"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - trip_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    container_name: trip_planner_frontend
    restart: always
    depends_on:
      - backend
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - trip_network

volumes:
  postgres_data:

networks:
  trip_network:
    driver: bridge
